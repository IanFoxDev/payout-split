name: Bug report
description: A share, carry-over or verification that is wrong
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: payout-split version
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: The input and rules
      description: The smallest pool, weights, carried-over amounts and rules that show it. Made-up ids are fine.
      render: php
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you got and what you expected
    validations:
      required: true
